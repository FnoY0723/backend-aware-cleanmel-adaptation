config: configs/recipes/funasr_prop.yaml
print_config: false
log_level: INFO
drop_last_iter: false
dry_run: false
iterator_type: sequence
valid_iterator_type: null
output_dir: exp/funasr_prop
ngpu: 1
seed: 2026
num_workers: 4
num_att_plot: 0
dist_backend: nccl
dist_init_method: env://
dist_world_size: 8
dist_rank: 0
local_rank: 0
dist_master_addr: localhost
dist_master_port: 45291
dist_launcher: null
multiprocessing_distributed: true
unused_parameters: false
sharded_ddp: false
use_deepspeed: false
deepspeed_config: null
gradient_as_bucket_view: true
ddp_comm_hook: null
cudnn_enabled: true
cudnn_benchmark: false
cudnn_deterministic: true
use_tf32: false
collect_stats: false
write_collected_feats: false
max_epoch: 20
patience: null
val_scheduler_criterion:
- valid
- loss
early_stopping_criterion:
- valid
- loss
- min
best_model_criterion:
-   - valid
    - cer_ctc
    - min
keep_nbest_models: 100
nbest_averaging_interval: 100
grad_clip: 5.0
grad_clip_type: 2.0
grad_noise: false
accum_grad: 10
no_forward_run: false
resume: true
train_dtype: float32
use_amp: true
log_interval: 100
use_matplotlib: true
use_tensorboard: true
create_graph_in_tensorboard: false
use_wandb: false
wandb_project: null
wandb_id: null
wandb_entity: null
wandb_name: null
wandb_model_log_interval: -1
detect_anomaly: false
use_adapter: false
adapter: lora
save_strategy: all
adapter_conf: {}
pretrain_path: null
init_param: []
ignore_init_mismatch: false
freeze_param:
- encoder
- ctc_decoder
- ctc
num_iters_per_epoch: 1000
batch_size: 20
valid_batch_size: null
batch_bins: 80000000
valid_batch_bins: null
category_sample_size: 10
upsampling_factor: 0.5
category_upsampling_factor: 0.5
dataset_upsampling_factor: 0.5
dataset_scaling_factor: 1.2
max_batch_size: null
min_batch_size: 1
train_shape_file:
- exp_funasrnano_ctc_0427_libriaishell_online/asr_stats_raw_en_bpe60515/train/speech_shape
- exp_funasrnano_ctc_0427_libriaishell_online/asr_stats_raw_en_bpe60515/train/text_shape.bpe
valid_shape_file:
- exp_funasrnano_ctc_0427_libriaishell_online/asr_stats_raw_en_bpe60515/valid/speech_shape
- exp_funasrnano_ctc_0427_libriaishell_online/asr_stats_raw_en_bpe60515/valid/text_shape.bpe
batch_type: numel
valid_batch_type: null
fold_length:
- 80000
- 150
sort_in_batch: descending
shuffle_within_batch: false
sort_batch: descending
multiple_iterator: false
chunk_length: 500
chunk_shift_ratio: 0.5
num_cache_chunks: 1024
chunk_excluded_key_prefixes: []
chunk_default_fs: null
chunk_max_abs_length: null
chunk_discard_short_samples: true
train_data_path_and_name_and_type:
-   - dump/raw/train_libri_aishell2_clean/wav.scp
    - speech
    - kaldi_ark
-   - dump/raw/train_libri_aishell2_clean/text
    - text
    - text
valid_data_path_and_name_and_type:
-   - dump/raw/dt05_multi_isolated_1ch_track/wav.scp
    - speech
    - kaldi_ark
-   - dump/raw/dt05_multi_isolated_1ch_track/text
    - text
    - text
multi_task_dataset: false
allow_variable_data_keys: false
max_cache_size: 0.0
max_cache_fd: 32
allow_multi_rates: false
valid_max_cache_size: null
exclude_weight_decay: false
exclude_weight_decay_conf: {}
optim: adamw
optim_conf:
    lr: 0.0001
    weight_decay: 0.01
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 500
